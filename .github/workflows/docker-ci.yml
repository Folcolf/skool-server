name: Build, Test, Dockerize & Push

on:
  push:
    branches:
      - master
      - develop
      - 'fix/**'
      - 'feature/**'

jobs:
  build:
    if: github.ref_name != 'master' && github.ref_name != 'develop'
    runs-on: ubuntu-latest
    environment: Skool
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Maven and run tests
        run: ./mvnw --batch-mode clean verify
      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/jacoco-report
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skool-server:$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)

  release:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    environment: Skool
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Demander validation manuelle pour release
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
      - name: Supprimer -SNAPSHOT du pom.xml
        run: ./mvnw --batch-mode versions:set -DremoveSnapshot
      - name: Extraire la version du pom.xml
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit version release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "release: ${{ steps.version.outputs.version }}"
      - name: Taguer la release
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}
      - name: Build & push Docker image versionnée
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skool-server:${{ steps.version.outputs.version }}
      - name: Incrémenter version mineure et remettre -SNAPSHOT
        id: bump
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          NEXT_MINOR=$((MINOR+1))
          NEXT_VERSION="$MAJOR.$NEXT_MINOR.0-SNAPSHOT"
          ./mvnw --batch-mode versions:set -DnewVersion=$NEXT_VERSION
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
      - name: Commit et push version snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "chore: prepare next development iteration ${{ steps.bump.outputs.next_version }}"
          git push origin HEAD:release/${{ github.ref_name }}
